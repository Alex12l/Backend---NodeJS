<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Activos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">
        <div class="formulario listado">

            <h2 class="titulo">Listado de Activos</h2>

            <table class="tabla-activos">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Categoría</th>
                        <th>Descripción</th>
                        <th>Fotografía</th>
                        <th>Estado</th>
                        <th>Precio</th>
                        <th>Fecha Registro</th>
                    </tr>
                </thead>

                <tbody id="tablaActivos">
                </tbody>

            </table>

        </div>
    </div>


    <script>

        fetch('/api/activos')
            .then(response => response.json())
            .then(resultado => {

                const tabla = document.getElementById('tablaActivos');

                resultado.data.forEach(activo => {

                    const fila = document.createElement('tr');

                    fila.innerHTML = `
                        <td>${activo.id}</td>
                        <td>${activo.idcategoria}</td>
                        <td>${activo.descripcion}</td>
                        <td>${activo.fotografia}</td>
                        <td>${activo.estado}</td>
                        <td>S/ ${activo.precio}</td>
                        <td>${activo.fecharegistro}</td>
                    `;

                    tabla.appendChild(fila);

                });

            })
            .catch(error => {
                console.error('Error al obtener los activos:', error);
            });

    </script>

</body>
</html>
